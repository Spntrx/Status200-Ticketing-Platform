<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Status 200 Tickets — Dashboard</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f3f4f6; margin: 0; padding: 24px; color: #111827; }
    .container { max-width: 860px; margin: 0 auto; }
    .topbar { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
    .badge { background: #1d4ed8; color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 13px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; margin-bottom: 20px; }
    h2 { margin: 0 0 16px; font-size: 16px; color: #111827; }
    .row { display: flex; gap: 12px; margin-bottom: 12px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    button { background: #1d4ed8; color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; font-size: 14px; }
    button.secondary { background: #fff; color: #374151; border: 1px solid #d1d5db; }
    button.danger { background: #dc2626; }
    .ticket { border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #eff6ff; color: #1d4ed8; margin-right: 6px; }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="brand"><span class="badge">200</span> Status 200 Dashboard</div>
      <div>
        <span id="userLabel" style="margin-right:12px; font-size:14px; color:#4b5563;">Authenticated User</span>
        <button class="secondary" onclick="logout()">Sign out</button>
      </div>
    </div>

    <div class="card">
      <h2>Create New Ticket</h2>
      <form id="ticketForm">
        <div class="row">
          <input type="text" id="title" placeholder="Ticket title (e.g., Server Timeout Error)" required />
          <select id="priority" style="max-width: 180px;">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
        <div class="row">
          <textarea id="description" rows="2" placeholder="Describe the issue..." required></textarea>
        </div>
        <button type="submit">+ Create Ticket</button>
      </form>
    </div>

    <div class="card">
      <h2>Active Tickets</h2>
      <div id="ticketList">Loading tickets...</div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token') || localStorage.getItem('authToken') || localStorage.getItem('jwt');
    if (!token) window.location.href = '/index.html';

    const headers = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };

    async function loadTickets() {
      const res = await fetch('/api/tickets', { headers });
      const data = await res.json();
      const tickets = Array.isArray(data) ? data : (data.tickets || []);
      const list = document.getElementById('ticketList');
      if (!tickets.length) {
        list.innerHTML = '<p style="color:#6b7280; font-size:14px;">No tickets yet. Create one above.</p>';
        return;
      }
      list.innerHTML = tickets.map(t => `
        <div class="ticket">
          <div>
            <div style="font-weight:600; margin-bottom:4px;">${t.title}</div>
            <div style="font-size:14px; color:#4b5563; margin-bottom:8px;">${t.description}</div>
            <span class="pill">${t.priority || 'Medium'}</span>
            <span class="pill">${t.status || 'Open'}</span>
          </div>
          <div class="actions">
            <button class="secondary" onclick="toggleStatus('${t._id}', '${t.status || 'Open'}')">Mark Resolved</button>
            <button class="danger" onclick="deleteTicket('${t._id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('ticketForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      await fetch('/api/tickets', {
        method: 'POST',
        headers,
        body: JSON.stringify({
          title: document.getElementById('title').value,
          priority: document.getElementById('priority').value,
          description: document.getElementById('description').value,
        })
      });
      e.target.reset();
      loadTickets();
    });

    async function toggleStatus(id, current) {
      const next = current === 'Resolved' ? 'Open' : 'Resolved';
      await fetch(`/api/tickets/${id}`, { method: 'PUT', headers, body: JSON.stringify({ status: next }) });
      loadTickets();
    }

    async function deleteTicket(id) {
      await fetch(`/api/tickets/${id}`, { method: 'DELETE', headers });
      loadTickets();
    }

    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }

    loadTickets();
  </script>
</body>
</html>
